{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title">{{ publicacion.titulo }}</h2>
                <p class="text-muted mb-1">
                    <strong>Autor:</strong> {{ publicacion.autor }}
                </p>
                <p class="text-muted mb-3">
                    <strong>Fecha:</strong> {{ publicacion.fecha_publicacion }}
                </p>
                <hr>
                <p class="card-text">{{ publicacion.contenido }}</p>
            </div>
            <div class="card-footer bg-transparent">
                <a href="{% url 'publicaciones:lista_publicaciones' %}" class="btn btn-outline-secondary btn-sm">
                    &larr; Volver al listado
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
